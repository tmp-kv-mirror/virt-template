# Scheduled Renovate workflow for dependency updates.
#
# Uses the built-in GITHUB_TOKEN for GitHub API calls and branch
# creation. Renovate creates temporary branches directly in this
# repo (one per update) and opens PRs against the target branch.
#
# No additional secrets are required — GITHUB_TOKEN is automatically
# provided by GitHub Actions with the permissions declared below.

name: Renovate

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.16
        with:
          configurationFile: .github/renovate-config.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: debug
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_POST_UPGRADE_COMMANDS: '["make vendor", "make generate", "make manifests", "make fmt", "make vet"]'
